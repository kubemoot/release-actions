# Dependabot version updates: weekly, one grouped pull request per ecosystem.
# Commit prefixes drive the semantic version bump (chore and ci are patch bumps).
# Every pull request is reviewed by a maintainer before it merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/release-candidate-version"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directories:
      - "/build-image/buildah"
      - "/build-image/buildpacks"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
