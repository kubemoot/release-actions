# Release: every push to main that passes CI is tagged vX.Y.Z and gets a GitHub Release.
#
# The version comes from this repository's own release-candidate-version action:
# conventional commits since the last vX.Y.Z tag pick the bump, and a breaking change
# stays on 0.x until a maintainer dispatches with allow_major. Nothing here runs as a
# candidate (no image, no deployment), so the candidate X.Y.Z-rc.N is tagged straight
# as its final X.Y.Z. Consumers pin the tag's commit sha with a "# vX.Y.Z" comment,
# which Dependabot bumps.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_major:
        description: 'Let a breaking change leave major version 0'
        required: false
        default: false
        type: boolean

# One release at a time. A pending run that a newer push replaces loses nothing: the
# newer run's version and notes cover every commit since the last tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    # Only main is released; a dispatch from another branch runs CI and tags nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and write the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Calculate the version
        id: version
        uses: ./release-candidate-version
        with:
          tag_prefix: "v"
          allow_major: ${{ inputs.allow_major || false }}

      - name: Tag the release
        id: tag
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          tag="v$(rl_final_of "${VERSION}")"
          prev="$(rl_latest_final v HEAD)"
          { echo "## Changes${prev:+ since ${prev}}"; echo; rl_release_notes "${prev}" HEAD; } > "${NOTES}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Released ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: steps.version.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "release-actions ${TAG#v}" --notes-file "${NOTES}"
