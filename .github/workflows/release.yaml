# Release: every push to main that passes CI is tagged vX.Y.Z and gets a GitHub Release.
#
# The version comes from this repository's own release-candidate-version action:
# conventional commits since the last vX.Y.Z tag pick the bump, and a breaking change
# stays on 0.x until a maintainer dispatches with allow_major. Nothing here runs as a
# candidate (no image, no deployment), so the candidate X.Y.Z-rc.N is tagged straight
# as its final X.Y.Z. Consumers pin the tag's commit sha with a "# vX.Y.Z" comment,
# which Dependabot bumps.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_major:
        description: 'Let a breaking change leave major version 0'
        required: false
        default: false
        type: boolean

# One release at a time. A pending run that a newer push replaces loses nothing: the
# newer run's version and notes cover every commit since the last tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    # Only main is released; a dispatch from another branch runs CI and tags nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and write the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credential is stored; the release token is minted at the step that pushes.
          persist-credentials: false
          fetch-depth: 0

      - name: Calculate the version
        id: version
        uses: ./release-candidate-version
        with:
          tag_prefix: "v"
          allow_major: ${{ inputs.allow_major || false }}

      - name: Mint a release token
        id: app-token
        if: steps.version.outputs.release_created == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: release-actions
          permission-contents: write
          permission-workflows: write

      - name: Tag the release
        id: tag
        if: steps.version.outputs.release_created == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          if [ "${DRY_RUN:-false}" != true ]; then
            if [ -z "${GH_APP_TOKEN:-}" ]; then
              echo "::error::no release token: the mint step did not run" >&2
              exit 1
            fi
            auth="$(printf 'x-access-token:%s' "${GH_APP_TOKEN}" | base64 -w0)"
            echo "::add-mask::${auth}"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          fi
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          tag="v$(rl_final_of "${VERSION}")"
          prev="$(rl_latest_final v HEAD)"
          { echo "## Changes${prev:+ since ${prev}}"; echo; rl_release_notes "${prev}" HEAD; } > "${NOTES}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Released ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: steps.version.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "release-actions ${TAG#v}" --notes-file "${NOTES}"
