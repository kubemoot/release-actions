name: Release candidate version
description: >-
  Computes the next release candidate X.Y.Z-rc.N for a tag prefix and decides whether
  to build it. Needs a checkout with full history and tags. Also exports RELEASE_LIB,
  the path of this repository's release-lib.sh, for the job's later steps.

inputs:
  tag_prefix:
    description: Tag prefix of the component, e.g. "v" or "agent-runtime-v"
    required: true
  change_path:
    description: Count only commits that touch this path (empty = the whole repository)
    required: false
    default: ''
  force:
    description: >-
      "true" builds a candidate even without new commits, as the next free rc.N (the
      next patch's rc.0 when the commit's version is promoted)
    required: false
    default: 'false'
  allow_major:
    description: >-
      "true" lets a breaking change leave major version 0; otherwise a breaking change
      on 0.x bumps the minor version
    required: false
    default: 'false'

outputs:
  version:
    description: The candidate version, X.Y.Z-rc.N
    value: ${{ steps.hold.outputs.version }}
  version_tag:
    description: The candidate tag, <tag_prefix>X.Y.Z-rc.N (never one that already exists elsewhere)
    value: ${{ inputs.tag_prefix }}${{ steps.hold.outputs.version }}
  release_created:
    description: '"true" when the candidate should be built'
    value: ${{ steps.check.outputs.release_created }}

runs:
  using: composite
  steps:
    - id: lib
      shell: bash
      env:
        LIB: ${{ github.action_path }}/../release-lib.sh
      run: |
        lib="$(realpath -e "${LIB}")"
        echo "RELEASE_LIB=${lib}" >> "$GITHUB_ENV"

    # X.Y.Z is one bump past the last promoted (final) <prefix>X.Y.Z tag, from the
    # conventional commits since it; N counts those commits, so it only grows, and the
    # promoted X.Y.Z sorts above all of its candidates. The action accepts only
    # <prefix>X.Y.Z tags as a base, so candidate tags never become one.
    - id: version
      uses: paulhatch/semantic-version@v6.0.4
      with:
        tag_prefix: ${{ inputs.tag_prefix }}
        major_pattern: "(BREAKING CHANGE|feat!|fix!)"
        minor_pattern: "feat"
        version_format: "${major}.${minor}.${patch}-rc.${increment}"
        bump_each_commit: false
        search_commit_body: true
        change_path: ${{ inputs.change_path }}

    # A breaking change on 0.x bumps the minor version (rl_hold_zero_major). The
    # candidate never reuses a taken rc.N: a forced rebuild of an unchanged commit gets
    # the next free one (rl_free_rc).
    - id: hold
      shell: bash
      env:
        PREFIX: ${{ inputs.tag_prefix }}
        VERSION: ${{ steps.version.outputs.version }}
        ALLOW_MAJOR: ${{ inputs.allow_major }}
        FORCE: ${{ inputs.force }}
      run: |
        # shellcheck source=/dev/null
        source "${RELEASE_LIB}"
        held="$(rl_held_version "${PREFIX}" "${VERSION}" "${ALLOW_MAJOR}")"
        free="$(rl_free_rc "${PREFIX}" "${held}" "${FORCE}")"
        echo "version=${free}" >> "$GITHUB_OUTPUT"

    - id: check
      shell: bash
      env:
        PREFIX: ${{ inputs.tag_prefix }}
        VERSION: ${{ steps.hold.outputs.version }}
        CHANGED: ${{ steps.version.outputs.changed }}
        FORCE: ${{ inputs.force }}
      run: |
        # shellcheck source=/dev/null
        source "${RELEASE_LIB}"
        rl_release_needed "${PREFIX}" "${VERSION}" "${CHANGED}" "${FORCE}" >> "$GITHUB_OUTPUT"
