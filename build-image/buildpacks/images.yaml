# The Cloud Native Buildpacks images every buildpacks image build uses, pinned by tag
# and digest. build-image-buildpacks.sh reads an entry by its name.
#
# Not applied to a cluster. The apiVersion and kind make Dependabot's docker ecosystem
# read this file as a Kubernetes manifest, so it refreshes each image: tag and digest.
#
# builder-java-tiny: the Paketo Java builder (Liberica JRE, executable-jar, Spring Boot,
#   image-labels, procfile) with the lifecycle; the build pod runs this image. Its
#   procfile and image-labels buildpacks also package a binary built elsewhere.
# builder: the full Paketo Ubuntu Noble builder (Node.js, Python, web servers with
#   nginx, Go, Java, procfile, image-labels) with the lifecycle, for builds from source.
# run-tiny: the distroless-like Ubuntu Noble run image the app layers go on (no shell,
#   no package manager; glibc, openssl, ca-certificates, tzdata).
# run-static: the Ubuntu Noble run image for statically linked binaries (ca-certificates
#   and tzdata only; no libc, no shell).
# run-base: the Ubuntu Noble run image with a shell and the common libraries, for the
#   Node.js, Python and nginx apps the builder builds.
apiVersion: v1
kind: List
metadata: {}
items:
  - name: builder-java-tiny
    image: docker.io/paketobuildpacks/builder-noble-java-tiny:0.0.197@sha256:b95da27fce97b58037f0c11ae934760c50730da4c9a24976205b53638592eba9
  - name: builder
    image: docker.io/paketobuildpacks/ubuntu-noble-builder:0.0.203@sha256:ba79c24b55830210fc5ee06768237ab989dbaeec36adb60a986bcb8e70e4d7cd
  - name: run-tiny
    image: docker.io/paketobuildpacks/ubuntu-noble-run-tiny:0.0.143@sha256:ab5827686b2c57966c84c3bf9c395fffe848175a561a648e45cb75fc797bbd11
  - name: run-static
    image: docker.io/paketobuildpacks/ubuntu-noble-run-static:0.0.143@sha256:6243141ce5550034ba21a76c0b6ea9fd636b5b43c34092a391c2e12aa1673aa5
  - name: run-base
    image: docker.io/paketobuildpacks/ubuntu-noble-run:0.0.143@sha256:23f6b39aa1ed203dadb785399c1b9b5cbefdf14f27432c731394bdaa94f3f12d
